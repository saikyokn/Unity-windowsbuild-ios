name: Build Unsigned IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -archivePath $PWD/build/Unity-iPhone.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_METHOD=manual \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Create IPA (Payload)
        run: |
          mkdir -p Payload
          # .appフォルダを執念で探してPayloadにコピーするんや
          find build/Unity-iPhone.xcarchive -name "*.app" -exec cp -r {} Payload/ \;
          zip -r MyGame.ipa Payload

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned_IPA
          path: MyGame.ipa
